name: Generate Prediction

on:
  schedule:
    # 每周一三五 UTC 00:00 = 北京时间 08:00（周二/四/日开奖前一早生成预测）
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Generate LLM model predictions
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: python3 generate_ai_prediction.py

      - name: Commit & push predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_predictions.json data/predictions_history.json
          git diff --staged --quiet || git commit -m "chore: generate LLM predictions $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
